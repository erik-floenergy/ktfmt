# When a new release is created, publish artifacts to Maven Central / JetBrains Marketplace / etc..
#
# About secrets used here:
# 1. OSSRH_USERNAME, OSSRH_TOKEN: token obtained from https://oss.sonatype.org/
# 2. OSSRH_GPG_SECRET_KEY - private key for signing Maven artifacts
# 3. OSSRH_GPG_SECRET_KEY_PASSWORD - password for unlocking OSSRH_GPG_SECRET_KEY
# 4. JETBRAINS_MARKETPLACE_TOKEN - token obtained from https://plugins.jetbrains.com/author/me/tokens

name: Publish package to Maven Central and JetBrains Marketplace
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag'
        required: true
        type: string
jobs:
  publish_ide_plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Publish IntelliJ plugin to JetBrains Marketplace
        run: ./gradlew :idea_plugin:publishPlugin --stacktrace --no-daemon
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}

  publish_maven_artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - id: install-secret-key
        name: Install gpg secret key
        run: |
          cat <(echo -e "${{ secrets.OSSRH_GPG_SECRET_KEY }}") | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - id: publish-to-central
        name: Publish to Maven Central Repository
        env:
          SIGN_BUILD: true
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: |
          ./gradlew :ktfmt:publish closeAndReleaseStagingRepositories \
              --stacktrace \
              --no-daemon \
              -Psigning.gnupg.passphrase="$GPG_PASSPHRASE"

  upload_github_artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to upload release assets
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Debug release tag
        run: |
          echo "Release tag: ${{ github.event.release.tag_name || inputs.release_tag }}"

      - name: Build JAR artifacts
        run: ./gradlew :ktfmt:jar :ktfmt:shadowJar --stacktrace --no-daemon

      - name: Verify JAR artifacts exist
        run: ls -la core/build/libs/ktfmt-*.jar

      - name: Upload JAR artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: |
            core/build/libs/ktfmt-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_native_release_assets:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu

      # Keep the Gradle JVM on Zulu 21 while exposing GRAALVM_HOME for native-image.
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.1'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: 'false'
          native-image-job-reports: 'true'

      - name: Build Native Image (non-Windows)
        if: runner.os != 'Windows'
        run: ./gradlew :ktfmt:nativeCompile --stacktrace --no-daemon

      - name: Build Native Image (Windows)
        if: runner.os == 'Windows'
        run: .\\gradlew.bat :ktfmt:nativeCompile --stacktrace --no-daemon

      - name: Prepare native binary asset (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p native-assets
          cp core/build/native/nativeCompile/ktfmt native-assets/ktfmt-$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')-$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')

      - name: Prepare native binary asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native-assets -Force | Out-Null
          $target = "native-assets/ktfmt-windows-$($env:RUNNER_ARCH.ToLower()).exe"
          Copy-Item "core/build/native/nativeCompile/ktfmt.exe" $target

      - name: Upload native build artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: native-assets/*

  upload_native_release_assets:
    needs: build_native_release_assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-assets
          merge-multiple: true

      - name: Verify native artifacts exist
        run: ls -la native-assets

      - name: Upload native binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag }}
          files: native-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy_website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4

      - name: Deploy website
        run: |
          KTFMT_TMP_DIR=$(mktemp -d)

          pushd website
          npm install .
          KTFMT_WEBSITE_OUTPUT_DIR="$KTFMT_TMP_DIR" gulp build-website
          popd

          git fetch
          git checkout gh-pages
          git config user.email ktfmt@facebook.com
          git config user.name ktfmt

          rm -rf *
          cp -R "$KTFMT_TMP_DIR"/* .

          git add .
          git commit -m "Publish website"
          git push --force

          rm -rf "$KTFMT_TMP_DIR"
