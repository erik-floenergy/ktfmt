name: Build and Test

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # test against relevant LTS versions of Java
        java: [17, 21]
    name: Build ktfmt on Java ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: zulu
      - name: Build ktfmt
        run: ./gradlew build --no-daemon

  native:
    name: Build native image (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu

      # set-java-home is intentionally 'false': keep JAVA_HOME on Zulu 21 while exposing
      # GRAALVM_HOME for the GraalVM Gradle plugin to find native-image.
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25.0.1'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: 'false'
          native-image-job-reports: 'true'

      - name: Build Native Image (non-Windows)
        if: runner.os != 'Windows'
        run: ./gradlew :ktfmt:nativeCompile --stacktrace --no-daemon

      - name: Build Native Image (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat :ktfmt:nativeCompile --stacktrace --no-daemon

      - name: Smoke test Native Image (non-Windows)
        if: runner.os != 'Windows'
        run: ./native_smoke_test.sh

      - name: Upload Native Image artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ktfmt-native-linux-${{ github.sha }}
          path: core/build/native/nativeCompile/ktfmt
          if-no-files-found: error

      - name: Upload Native Image artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ktfmt-native-macos-${{ github.sha }}
          path: core/build/native/nativeCompile/ktfmt
          if-no-files-found: error

      - name: Upload Native Image artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ktfmt-native-windows-${{ github.sha }}
          path: core/build/native/nativeCompile/ktfmt.exe
          if-no-files-found: error
